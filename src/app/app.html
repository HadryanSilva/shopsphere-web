<a class="skip-link" [href]="router.url.split('#')[0] + '#conteudo'">Saltar para o conteúdo</a>

<header class="site-header">
  <div class="container header-content">
    <a class="brand" routerLink="/" aria-label="ShopSphere — página inicial">
      <span class="brand-symbol" aria-hidden="true">S</span>
      ShopSphere<span class="brand-dot" aria-hidden="true">.</span>
    </a>

    <form class="search" role="search" (submit)="search(searchInput.value, $event)">
      <label class="visually-hidden" for="product-search">Pesquisar produtos</label>
      <button type="submit" aria-label="Pesquisar produtos">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
      </button>
      <input
        #searchInput
        id="product-search"
        type="search"
        placeholder="O que procura hoje?"
        [value]="searchName()"
        name="name"
      />
    </form>

    <nav class="account-nav" aria-label="Conta e compras">
      <button type="button" disabled aria-label="Minha conta" aria-describedby="features-note">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
        </svg>
        <span>Minha conta</span>
      </button>
      <button type="button" disabled aria-label="Carrinho" aria-describedby="features-note">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 7h14l1 14H4L5 7Z" />
          <path d="M8 7V6a4 4 0 0 1 8 0v1" />
        </svg>
        <span>Carrinho</span>
      </button>
    </nav>
  </div>
</header>

<main id="conteudo" class="container main-content" tabindex="-1">
  <router-outlet />
  <p id="features-note" class="features-note">
    Conta e carrinho estarão disponíveis nas próximas etapas.
  </p>
</main>

<footer class="site-footer">
  <div class="container footer-content">
    <a class="brand footer-brand" routerLink="/"
      >ShopSphere<span class="brand-dot" aria-hidden="true">.</span></a
    >
    <p>Um lugar. Muitas possibilidades.</p>
    <a [href]="router.url.split('#')[0] + '#conteudo'"
      >Voltar ao início <span aria-hidden="true">↑</span></a
    >
  </div>
</footer>
